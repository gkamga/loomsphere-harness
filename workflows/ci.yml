name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-safe:
    name: Backend safe tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Validate agent, skill, and contract definitions
        run: bash scripts/validate.sh --factory
      - name: Run backend safe validation
        run: bash scripts/validate.sh --backend
      - name: Record and verify allowlisted execution evidence
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/factory-execution-evidence.json"
          uv run --project backend python scripts/factory_execute.py --list
          uv run --project backend python scripts/factory_execute.py \
            --check factory-contract-validation \
            --output "${artifact}"
          uv run --project backend python scripts/factory_execute.py --verify "${artifact}"
          cat "${artifact}"

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend lint, type check, and production build
        run: bash scripts/validate.sh --frontend

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loomsphere_ci
          POSTGRES_USER: loomsphere_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomsphere_ci -d loomsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      TEST_DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: loomsphere_ci
      PGDATABASE: loomsphere_ci
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Verify disposable PostgreSQL destination
        run: |
          set -euo pipefail
          if [[ "$DATABASE_URL" != "$TEST_DATABASE_URL" ]]; then
            echo "DATABASE_URL and TEST_DATABASE_URL must target the same CI database." >&2
            exit 1
          fi
          identity="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT current_database() || '|' || current_user || '|' || inet_server_addr()")"
          if [[ "$identity" != "loomsphere_ci|loomsphere_ci|"* ]]; then
            echo "Connected PostgreSQL identity did not match the job-scoped database." >&2
            exit 1
          fi
          table_count="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
          if [[ "$table_count" != "0" ]]; then
            echo "Expected a fresh CI database with no application tables." >&2
            exit 1
          fi
          echo "LOOMSPHERE_DB_ISOLATION_VERIFIED=1" >> "$GITHUB_ENV"
      - name: Run database integration validation
        run: bash scripts/validate.sh --db

  database-migrations:
    name: Database migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loomsphere_ci
          POSTGRES_USER: loomsphere_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomsphere_ci -d loomsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      TEST_DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: loomsphere_ci
      PGDATABASE: loomsphere_ci
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Verify disposable PostgreSQL destination
        run: |
          set -euo pipefail
          if [[ "$DATABASE_URL" != "$TEST_DATABASE_URL" ]]; then
            echo "DATABASE_URL and TEST_DATABASE_URL must target the same CI database." >&2
            exit 1
          fi
          identity="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT current_database() || '|' || current_user || '|' || inet_server_addr()")"
          if [[ "$identity" != "loomsphere_ci|loomsphere_ci|"* ]]; then
            echo "Connected PostgreSQL identity did not match the job-scoped database." >&2
            exit 1
          fi
          table_count="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
          if [[ "$table_count" != "0" ]]; then
            echo "Expected a fresh CI database with no application tables." >&2
            exit 1
          fi
          echo "LOOMSPHERE_DB_ISOLATION_VERIFIED=1" >> "$GITHUB_ENV"
      - name: Run database migration validation
        run: bash scripts/validate.sh --migrations

  playwright-e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loomsphere_ci
          POSTGRES_USER: loomsphere_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomsphere_ci -d loomsphere_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      TEST_DATABASE_URL: postgresql+psycopg://loomsphere_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/loomsphere_ci
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
      API_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_PORT: '8000'
      PLAYWRIGHT_WEB_PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: loomsphere_ci
      PGDATABASE: loomsphere_ci
      PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install locked Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify disposable PostgreSQL destination
        run: |
          set -euo pipefail
          if [[ "$DATABASE_URL" != "$TEST_DATABASE_URL" ]]; then
            echo "DATABASE_URL and TEST_DATABASE_URL must target the same CI database." >&2
            exit 1
          fi
          identity="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT current_database() || '|' || current_user || '|' || inet_server_addr()")"
          if [[ "$identity" != "loomsphere_ci|loomsphere_ci|"* ]]; then
            echo "Connected PostgreSQL identity did not match the job-scoped database." >&2
            exit 1
          fi
          table_count="$(psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
            --command "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")"
          if [[ "$table_count" != "0" ]]; then
            echo "Expected a fresh CI database with no application tables." >&2
            exit 1
          fi
          echo "LOOMSPHERE_DB_ISOLATION_VERIFIED=1" >> "$GITHUB_ENV"
      - name: Run Playwright validation
        run: bash scripts/validate.sh --e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
