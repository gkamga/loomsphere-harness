[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loomsphere-harness"
version = "0.1.0"
description = "Standalone LoomSphere engineering harness runtime: Intake, Architect, digest-bound approval, Builder, sandboxed validation, QA, Reviewer, and delivery acceptance."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["ai-agents", "engineering-harness", "code-review", "sandbox", "approval-gate"]
# No `license` field: selecting a license is a human decision that this release
# does not make. Add exactly one `license`/`license-files` declaration once a
# LICENSE file is approved. See docs/RELEASE-0.1.0.md.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai-slim[openai]>=2.64.0",
    "pydantic-ai-harness>=0.64.0",
]

[project.urls]
Documentation = "https://github.com/gkamga/loomsphere-harness/blob/main/docs/QUICKSTART.md"
Repository = "https://github.com/gkamga/loomsphere-harness"
Changelog = "https://github.com/gkamga/loomsphere-harness/blob/main/docs/RELEASE-0.1.0.md"

[project.optional-dependencies]
# Used by the asset validators and the existing harness tests, not by the runtime.
dev = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[project.scripts]
loomsphere-harness = "loomsphere_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
