name: Harness CI

# Self-contained: validates the declarative harness with Python and Git alone. It
# needs no LoomSphere backend, frontend, PostgreSQL, or Docker service.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Manifest, assets, contracts, links, and consumption
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the package with the validator dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify the asset manifest
        run: python tools/build_manifest.py --check
      - name: Validate agents, skills, hooks, contracts, examples, and links
        run: python tools/validate_harness.py
      - name: Run the harness test suite (validation semantics and independent consumption)
        run: python -m unittest discover -s tests -v

  runtime:
    name: Standalone runtime tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported runtime, the version the validators use, and current.
        # 3.14 is added alongside the existing versions, never in place of them.
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and dev requirements
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify the asset manifest and validate the harness
        run: |
          python tools/build_manifest.py --check
          python tools/validate_harness.py
      # No secret is needed: models are scripted, and the live acceptance test
      # skips itself unless LOOMSPHERE_ACCEPTANCE_API_KEY is set (never set in CI).
      - name: Run the runtime tests
        run: python -m unittest tests.test_runtime tests.test_runtime_hooks_routing -v
      - name: Smoke-test the installed CLI
        run: loomsphere-harness --help

  installer-minimum-python:
    name: Installer on the oldest supported Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - name: Run the installer tests (standard library only)
        run: python -m unittest discover -s tests -p 'test_install.py' -v
